<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>記録</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{--bg:#f5f6f8; --card:#e7ecff; --text:#111827; --muted:#4b5563; --gap:16px;}
    *{box-sizing:border-box; font-family:"Segoe UI",system-ui,-apple-system,sans-serif;}
    body{margin:0; background:var(--bg); color:var(--text);}
    .titlebar{background:#fff;border-bottom:1px solid #e5e7eb;padding:22px 16px;display:flex;align-items:center;justify-content:space-between;}
    .titlebar-left{display:flex;align-items:center;gap:8px;}
    .brand{font-size:24px;font-weight:700;letter-spacing:.5px;color:var(--text);text-decoration:none;}
    .subtitle{font-size:12px;color:var(--muted);}
    .todaybtn{font-size:14px;text-decoration:none;background:#6aa9ff;border:1px solid #6aa9ff;padding:10px 16px;border-radius:10px;color:#0b1020;font-weight:700;}
    .userbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:8px 16px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:12px;}
    .wrap{max-width:980px;margin:var(--gap) auto;padding:var(--gap) 20px 90px;}
    .card{background:var(--card);border:1px solid #c7d2fe;border-radius:16px;padding:16px;box-shadow:0 6px 18px rgba(17,24,39,.08);}
    .card + .card{margin-top:var(--gap);}
    .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
    .calnav a{text-decoration:none;color:#111827;border:1px solid #e5e7eb;background:#fff;padding:6px 10px;border-radius:8px;}
    .calendar{width:100%;border-collapse:collapse;font-size:12px;}
    .calendar th,.calendar td{border:1px solid #c7d2fe;vertical-align:top;padding:6px;min-height:180px;height:180px;}
    .daylink{display:inline-flex;align-items:center;gap:6px;color:#111827;text-decoration:none;}
    .dot{font-size:10px;color:#6aa9ff;}
    .selected{outline:2px solid #6aa9ff; border-radius:6px;}
    .daypanel{margin-top:var(--gap); background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:10px;}
    .daynum{font-weight:700;margin-bottom:4px;}
    .entry{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:6px;margin-top:4px;}
    .entry-actions{display:flex;gap:6px;margin-top:4px;}
    .iconbtn{border:1px solid #e5e7eb;background:#fff;border-radius:6px;padding:2px 6px;cursor:pointer;text-decoration:none;color:#111827;}
    .iconbtn.danger{color:#b91c1c;}
    .tabbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:space-around;padding:8px 6px;}
    .tabbar a{color:#374151;text-decoration:none;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;}
    .tabbar .icon{font-size:18px;}
    .active{color:#3b82f6;font-weight:700;}
    input[type="text"], input[type="date"], input[type="time"]{width:100%;padding:10px;border-radius:10px;border:1px solid #c7d2fe;background:#fff;}
    .btnrow{display:grid; grid-template-columns:repeat(3, 1fr); gap:8px;}
    .chip{border:1px solid #c7d2fe; border-radius:999px; overflow:hidden; cursor:pointer;}
    .chip input{display:none;}
    .chip span{display:block; padding:8px 0; text-align:center; background:#fff; font-weight:700; font-size:13px;}
    .chip input:checked + span{background:#6aa9ff; color:#0b1020;}
    .actionbtn{width:100%; margin-top:12px; padding:12px 16px; border:none; border-radius:12px; background:#6aa9ff; color:#0b1020; font-weight:800; font-size:16px; display:block; text-align:center; text-decoration:none;}
  </style>
</head>
<body>
<header class="titlebar">
  <div class="titlebar-left">
    <a class="brand" href="/">Trainbrella</a>
    <span class="subtitle">/ 記録</span>
  </div>
  <a class="todaybtn" href="/today">本日の記録</a>
</header>
<div class="userbar">
  <div>登録情報</div>
  <div>名前：<span th:text="${user.name}">-</span></div>
  <div>出発地：<span th:text="${user.fromCity}">-</span></div>
  <div>到着地：<span th:text="${user.toCity}">-</span></div>
  <div>路線名：<span th:text="${(user.trainLinesDisplay != null and !user.trainLinesDisplay.isEmpty()) ? #strings.listJoin(user.trainLinesDisplay, ' / ') : user.trainLine}">-</span></div>
</div>

<div class="wrap">
  <div class="card form-card">
    <a class="actionbtn" href="/record/new">過去日付で記録</a>
  </div>

  <div class="card">
    <div th:if="${recordsByDate == null || recordsByDate.isEmpty()}">記録はありません</div>

    <div th:each="entry : ${recordsByDate}">
      <div class="daypanel">
        <div class="daynum" th:text="${entry.key}">2026-01-23</div>

        <div th:each="item : ${entry.value}">
          <div class="entry">
            <div th:text="${item.record.type + ' ' + item.record.action}">行き 出発</div>
            <div th:if="${item.record.dateTime != null}" th:text="${'日時：' + item.record.dateTime}">日時</div>
            <div th:if="${item.record.location != null}" th:text="${'場所：' + item.record.location}">場所</div>
            <div th:if="${item.record.weather != null}" th:text="${'天気：' + item.record.weather}">天気</div>
            <div th:if="${item.record.condition != null}" th:text="${'体調：' + item.record.condition}">体調</div>
            <div th:if="${item.record.delayed != null}" th:text="${'遅延：' + item.record.delayed}">遅延</div>
            <div th:if="${item.record.memo != null}" th:text="${item.record.memo}">メモ</div>
            <div class="entry-actions">
              <a class="iconbtn" th:href="@{/record/edit/{i}(i=${item.index})}" title="編集">✎</a>
              <form method="post" action="/record/delete">
                <input type="hidden" name="index" th:value="${item.index}">
                <button class="iconbtn danger" type="submit" title="削除">🗑</button>
              </form>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<nav class="tabbar">
  <a href="/"><span class="icon">🏠</span><span>トップ</span></a>
  <a href="/weather"><span class="icon">☁️</span><span>天気詳細</span></a>
  <a href="/train"><span class="icon">🚆</span><span>路線詳細</span></a>
  <a href="/record" class="active"><span class="icon">📝</span><span>記録</span></a>
  <a href="/user"><span class="icon">⚙️</span><span>ユーザー設定</span></a>
</nav>
</body>
</html>
